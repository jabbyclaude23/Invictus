<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />

    <title>Invictus</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- iOS / PWA friendly -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Invictus" />

    <!-- Optional font for consistency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      /* Prevent iPhone zoom on textarea/input focus */
      input, textarea {
        font-size: 16px !important;
      }

      /* Safe-area for iPhones with notch or home bar */
      .safe-area-inset-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Prevent page bounce scroll on iOS */
      body {
        overscroll-behavior-y: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
